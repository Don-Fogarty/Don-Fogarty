[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meridien-bulletin"
version = "0.1.0"
description = "Concise Slack daily and weekly company bulletin sender."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11.0",
  "openai>=1.66.0",
  "python-dotenv>=1.0.1",
  "slack-sdk>=3.36.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[project.scripts]
meridien-bulletin = "meridien_bulletin.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
